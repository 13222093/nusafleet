[project]
name = "nusafleet"
version = "0.1.0"
description = "Fleet and charging-site planner for inter-island ferries in North Maluku"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pulp>=2.8.0,<3",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["engine/_legacy", "dashboard"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["engine", "api"]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
