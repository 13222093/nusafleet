# Every assumed number used by the model. Each entry needs a source or a rationale.
# confidence: low | med | high

values:
  diesel_price_rp_per_l:
    value: 13000
    unit: Rp/L
    source: null
    rationale: "Non-subsidized marine diesel, order of magnitude. Planning uses the economic cost because the subsidy is a transfer. Swept from the subsidized level to a high-price case."
    confidence: low
  diesel_ef_kgco2_per_l:
    value: 2.68
    unit: kgCO2/L
    source: "IPCC 2006 Guidelines for National Greenhouse Gas Inventories, default factors for diesel oil (about 74.1 tCO2/TJ, about 2.68 kgCO2 per litre)"
    rationale: null
    confidence: high
  carbon_price_rp_per_tco2:
    value: 30000
    unit: Rp/tCO2
    source: "Indonesian Law No. 7/2021 (UU HPP), minimum carbon tax rate of Rp 30 per kgCO2e"
    rationale: "Used as the base case. Swept up to Rp 2.5 million per tCO2."
    confidence: med
  discount_rate:
    value: 0.08
    unit: fraction per year
    source: "Same value as the upstream Kopibara engine (constants.py)"
    rationale: "Used in the capital recovery factor to annualize capex."
    confidence: med
  operating_hours_per_day:
    value: 12
    unit: h/day
    source: null
    rationale: "Daylight operation, typical for small inter-island ferries."
    confidence: med
  idle_fuel_fraction:
    value: 0.15
    unit: fraction of underway fuel rate
    source: null
    rationale: "Fuel burned by auxiliaries during turnaround at the berth."
    confidence: low
  load_factor:
    value: 0.6
    unit: fraction of passenger capacity
    source: null
    rationale: "Average seats filled per trip over the year."
    confidence: low
  service_level:
    value: 0.95
    unit: fraction of annual demand
    source: null
    rationale: "Share of annual passenger demand the fleet must be able to carry."
    confidence: med
  charging_efficiency:
    value: 0.9
    unit: fraction
    source: null
    rationale: "Grid to battery efficiency, typical order of magnitude for shore charging."
    confidence: med
  charger_capex_rp:
    value: 15000000000
    unit: Rp per port
    source: null
    rationale: "Shore charging station with grid connection works, order of magnitude."
    confidence: low
  charger_life_years:
    value: 15
    unit: years
    source: null
    rationale: "Typical life of power electronics."
    confidence: med
  budget_rp:
    value: 400000000000
    unit: Rp
    source: null
    rationale: "Illustrative capital budget for new vessels and chargers."
    confidence: low
  min_avg_safety:
    value: 3.0
    unit: score 1 to 5
    source: "Same threshold as the upstream Kopibara engine (average fleet safety score of at least 3.0)"
    rationale: "Safety scores per vessel type are assumptions (newer vessels score higher)."
    confidence: low
  min_daily_trips:
    value: 1
    unit: one-way trips per day per route
    source: null
    rationale: "Every route keeps at least a minimum service."
    confidence: med
  max_vessels_per_type_route:
    value: 8
    unit: vessels
    source: null
    rationale: "Upper bound on the integer variables, well above any realistic answer for these routes."
    confidence: high

tables:
  routes:
    file: routes.csv
    source: null
    rationale: "Route list from the project data plan. Distances are great-circle distances between approximate port coordinates times a routing factor. Demand and current fleet are order-of-magnitude estimates until BPS, BPTD or ASDP figures are obtained."
    confidence: low
  ports:
    file: ports.csv
    source: null
    rationale: "Coordinates are approximate and must be checked against OpenStreetMap. Spare grid capacity per scenario is an assumption."
    confidence: low
  vessel_types:
    file: vessel_types.csv
    source: null
    rationale: "Parameterized archetypes, not designs. Capex, fuel burn, energy use, wave limits and safety scores are assumptions. Russian hybrid and electric vessels are concept references only."
    confidence: low
  wave_climate:
    file: wave_climate.csv
    source: null
    rationale: "Seasonal placeholder generated by scripts/fetch_waves.py (monsoon-shaped monthly mean wave height scaled by a route exposure factor, log-normal daily spread). To be replaced by Copernicus Marine or ERA5 reanalysis."
    confidence: low
  scenarios:
    file: scenarios.yaml
    source: null
    rationale: "Electricity prices, emission factors and charging capacity per supply scenario are assumptions. Scenario C is one supply option among three and its tariff is swept."
    confidence: low

sweeps:
  diesel_price_rp_per_l: [6800, 10000, 13000, 16000, 19000]
  elec_price_rp_per_kwh: [600, 1000, 1445, 2000, 2800]
  carbon_price_rp_per_tco2: [0, 30000, 250000, 500000, 1000000, 2500000]
  safety_threshold: [2.0, 2.5, 3.0, 3.5, 4.0, 4.5]
  pareto_points: 9
